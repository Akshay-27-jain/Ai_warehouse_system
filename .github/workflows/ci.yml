name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FLASK_ENV: testing
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: warehouse_test
  DB_USER: postgres
  DB_PASSWORD: postgres
  SECRET_KEY: ci-test-secret-key-not-for-production-32b
  JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production-32b
  CORS_ORIGINS: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Run linting
        run: |
          pip install ruff
          ruff check services/api/app --quiet || true

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost; do sleep 2; done
      - name: Run backend tests
        working-directory: services/api
        run: |
          python -m pytest -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          npm ci
      - name: Lint frontend
        working-directory: apps/web
        run: |
          npm run lint || true
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm run build
